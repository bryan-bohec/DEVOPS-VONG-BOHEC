name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  # ──────────────────────────────────────────────
  # Backend – Test & Coverage (matrix)
  # ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service: [api-gateway, auth-service, property-service, booking-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend/${{ matrix.service }}

      - name: Run Tests with Coverage
        run: npm run test:coverage
        working-directory: backend/${{ matrix.service }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}
          fail_ci_if_error: false

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:${{ github.sha }} \
                       -f backend/${{ matrix.service }}/Dockerfile \
                       ./backend/${{ matrix.service }}

  # ──────────────────────────────────────────────
  # Frontend – Build & Docker
  # ──────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Build Docker image
        run: |
          docker build -t frontend:${{ github.sha }} \
                       -f frontend/Dockerfile \
                       ./frontend

  # ──────────────────────────────────────────────
  # Docker Compose – Integration smoke test
  # ──────────────────────────────────────────────
  docker-compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all services with Docker Compose
        run: docker compose build

      - name: Verify compose config
        run: docker compose config --quiet
