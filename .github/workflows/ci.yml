name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  # ──────────────────────────────────────────────
  # Backend – Test & Coverage (matrix)
  # ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service: [api-gateway, auth-service, property-service, booking-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci
        working-directory: backend

      - name: Run Tests with Coverage
        run: npm run test:coverage --workspace=${{ matrix.service }}
        working-directory: backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}
          fail_ci_if_error: false

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:${{ github.sha }} \
                       -f backend/${{ matrix.service }}/Dockerfile \
                       ./backend

  # ──────────────────────────────────────────────
  # Frontend – Build & Docker
  # ──────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Build Docker image
        run: |
          docker build -t frontend:${{ github.sha }} \
                       -f frontend/Dockerfile \
                       ./frontend

  # ──────────────────────────────────────────────
  # SonarCloud – Analyse qualité (mono-projet)
  # ──────────────────────────────────────────────
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Re-generate coverage reports for SonarCloud (monorepo workspaces)
      - name: Install dependencies (workspaces)
        run: npm ci
        working-directory: backend

      - name: Tests + coverage (tous les services)
        run: |
          npm run test:coverage --workspace=api-gateway
          npm run test:coverage --workspace=auth-service
          npm run test:coverage --workspace=property-service
          npm run test:coverage --workspace=booking-service
        working-directory: backend

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────
  # Docker Compose – Integration smoke test
  # ──────────────────────────────────────────────
  docker-compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all services with Docker Compose
        run: docker compose build

      - name: Verify compose config
        run: docker compose config --quiet
