sonar.projectKey=bryan-bohec_DEVOPS-VONG-BOHEC
sonar.organization=bryan-bohec
sonar.host.url=https://sonarcloud.io

# Sources (exclude test files from main source analysis)
sonar.sources=backend/api-gateway/src,backend/auth-service/src,backend/property-service/src,backend/booking-service/src
sonar.source.exclusions=**/__tests__/**

# Tests (separate __tests__ directories)
sonar.tests=backend/api-gateway/src/__tests__,backend/auth-service/src/__tests__,backend/property-service/src/__tests__,backend/booking-service/src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage
sonar.javascript.lcov.reportPaths=backend/api-gateway/coverage/lcov.info,backend/auth-service/coverage/lcov.info,backend/property-service/coverage/lcov.info,backend/booking-service/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.ts,**/*.config.js

# Encoding
sonar.sourceEncoding=UTF-8
