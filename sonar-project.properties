sonar.projectName=DEVOPS-VONG-BOHEC
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend
sonar.tests=backend,frontend
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

sonar.javascript.lcov.reportPaths=backend/api-gateway/coverage/lcov.info,backend/auth-service/coverage/lcov.info,backend/property-service/coverage/lcov.info,backend/booking-service/coverage/lcov.info

# Exclude generated/build artifacts and legacy Java services from this Node-focused scan.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/gateway/**,backend/properties_service/**
