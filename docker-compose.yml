services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:3001
      PROPERTY_SERVICE_URL: http://property-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
    depends_on:
      - auth-service
      - property-service
      - booking-service

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_AUTH_PASSWORD:-dev-auth-db-password}@postgres-auth:5432/auth_db?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRES_IN: 7d
    command: sh -c "npx prisma db push && npm run start"
    depends_on:
      postgres-auth:
        condition: service_healthy

  property-service:
    build:
      context: ./backend/property-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:${POSTGRES_PROPERTY_PASSWORD:-dev-property-db-password}@postgres-property:5432/property_db?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      BOOKING_SERVICE_URL: http://booking-service:3003
    command: sh -c "npx prisma db push && npm run start"
    depends_on:
      postgres-property:
        condition: service_healthy

  booking-service:
    build:
      context: ./backend/booking-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:${POSTGRES_BOOKING_PASSWORD:-dev-booking-db-password}@postgres-booking:5432/booking_db?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      PROPERTY_SERVICE_URL: http://property-service:3002
    command: sh -c "npx prisma db push && npm run start"
    depends_on:
      postgres-booking:
        condition: service_healthy
      property-service:
        condition: service_started

  postgres-auth:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-dev-auth-db-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - type: bind
        source: ${POSTGRES_AUTH_DATA_PATH:-./docker-data/postgres-auth}
        target: /var/lib/postgresql/data

  postgres-property:
    image: postgres:17-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: property_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PROPERTY_PASSWORD:-dev-property-db-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - type: bind
        source: ${POSTGRES_PROPERTY_DATA_PATH:-./docker-data/postgres-property}
        target: /var/lib/postgresql/data

  postgres-booking:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOKING_PASSWORD:-dev-booking-db-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - type: bind
        source: ${POSTGRES_BOOKING_DATA_PATH:-./docker-data/postgres-booking}
        target: /var/lib/postgresql/data
