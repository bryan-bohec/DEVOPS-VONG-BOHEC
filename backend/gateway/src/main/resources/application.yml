server:
  port: 8888

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: property-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/properties/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**

        - id: location-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/location/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG